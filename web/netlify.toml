[build]
  command = "npm run build"
  publish = ".next"

# The app lives in web/, so Netlify does not install the Next.js runtime on its own.
# Without it, the deploy is only the raw .next folder and every page is a 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  # The model name and the public Supabase values are written into the app on purpose.
  # The real keys only show up in the Turbopack cache. The Next.js runtime copies
  # that cache to .netlify/.next/cache, and neither copy is published.
  SECRETS_SCAN_OMIT_KEYS = "AI_MODEL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/.next/cache/**,.env.example"
