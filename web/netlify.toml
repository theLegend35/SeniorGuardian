[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # The model name and the public Supabase values are written into the app on purpose.
  # The real keys only show up in the local build cache, which is not published.
  SECRETS_SCAN_OMIT_KEYS = "AI_MODEL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.env.example"
